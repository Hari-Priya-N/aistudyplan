name: personalized-learning-path-generator

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tutor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutor_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tutor_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tutor_user} -d ${POSTGRES_DB:-tutor_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Compose-network-aware overrides — everything else comes from .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-tutor_user}:${POSTGRES_PASSWORD:-tutor_pass}@postgres:5432/${POSTGRES_DB:-tutor_db}
      REDIS_URL: redis://redis:6379/0
      CHROMA_PERSIST_DIR: /data/chroma
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_data:
